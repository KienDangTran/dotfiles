# install.conf.yaml
- defaults:
    link:
      relink: true
      create: true
      force: true

- clean: ["~", "~/.config"]

- create:
    - ~/.vim

- link:
    ~/.wezterm.lua: config/wezterm/.wezterm.lua
    ~/.aliases: shell/.aliases
    ~/.zshrc: shell/.zshrc
    ~/.gitconfig: .gitconfig
    ~/.ideavimrc: shell/.ideavimrc
    ~/.markdownlint-cli2.yaml: shell/.markdownlint-cli2.yaml
    ~/.config:
      create: true
      relink: true
      glob: true
      path: config/**/**

# linux
- defaults:
    link:
      if: '[ "$(uname -s)" = "Linux" ]'

# mac
- defaults:
    link:
      if: '[ "$(uname -s)" = "Darwin" ]'
- link:
    ~/.gitlocal:
      path: git/mac
      force: true
    ~/Library/Application Support/lazygit/config.yml: config/lazygit/config.yml
    ~/Library/Application Support/jesseduffield/lazygit/config.yml: config/lazygit/config.yml

- shell:
    - description: install Linux packages (apt or dnf, including COPR-only tools)
      command: |
        if [ "$(uname -s)" = "Linux" ]; then
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh curl
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y zsh curl dnf-plugins-core
            sudo dnf copr enable -y atim/lazygit
            sudo dnf copr enable -y atim/starship
            sudo dnf copr enable -y wezfurlong/wezterm-nightly
            sudo dnf copr enable -y atim/delta
            sudo dnf install -y lazygit starship wezterm git-delta
          fi
        fi
      stdout: true
      stdin: true
    - [sudo chsh -s $(which zsh), Making zsh the default shell]
    - [git submodule update --init --recursive, Installing submodules]
