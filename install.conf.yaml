# install.conf.yaml
- defaults:
    link:
      relink: true
      create: true

- clean: ["~"]

- create:
    - ~/.vim

- link:
    ~/.wezterm.lua: config/wezterm/.wezterm.lua
    ~/.aliases: shell/.aliases
    ~/.zshrc: shell/.zshrc
    ~/.zsh_history: shell/.zsh_history
    ~/.sleep: shell/.sleep
    ~/.wakeup: shell/.wakeup
    ~/.gitconfig: .gitconfig
    ~/.ideavimrc: shell/.ideavimrc
    ~/.markdownlint-cli2.yaml: shell/.markdownlint-cli2.yaml
    ~/.config:
      create: true
      relink: true
      glob: true
      path: config/**/**
    ~/Library/Application Support/lazygit/config.yml: lazygit-config.yml
    ~/Library/Application Support/jesseduffield/lazygit/config.yml: lazygit-config.yml

- shell:
    - [chsh -s $(which zsh) || true, Making zsh the default shell]
    - [git submodule update --init --recursive || true, Installing submodules]

# This apply to all commands that come after setting the defaults.
- defaults:
    brewfile:
      stdout: false
      stderr: false
      include: ["tap", "brew", "cask", "mas"]
- brewfile:
    file: Brewfile
